name: tw-events

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe＝只測 API 格式（先跑這個）；run＝正式抓取（可續跑）"
        default: "probe"

permissions:
  contents: write

concurrency:
  group: tw-events
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: probe（只印 API 回應格式）
        if: ${{ github.event.inputs.mode != 'run' }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch_events.py --probe
      - name: run（正式抓取，約 300 分鐘預算，可續跑）
        if: ${{ github.event.inputs.mode == 'run' }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch_events.py --run --budget_min 300
      - name: 提交資料
        if: ${{ github.event.inputs.mode == 'run' }}
        run: |
          git config user.name "tw-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events
          git diff --cached --quiet && echo "沒有新資料" && exit 0
          git commit -m "update events $(date -u +%F)"
          git pull --rebase -q
          git push
