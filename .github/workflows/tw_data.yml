name: tw-data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "回補起始日 (YYYY-MM-DD)"
        default: "2023-01-01"
  schedule:
    - cron: "17 10 * * 1-5"  # UTC 10:17 = 台北 18:17（週一到週五）
    - cron: "43 11 * * 1-5"  # UTC 11:43 = 台北 19:43
    - cron: "23 13 * * 1-5"  # UTC 13:23 = 台北 21:23（補跑，GitHub 排程常延遲）
    - cron: "37 21 * * 0-4"  # UTC 21:37 = 台北 05:37（週一到週五早上補跑）

permissions:
  contents: write

concurrency:
  group: tw-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: 下載（可續傳，最多 320 分鐘）
        run: |
          START="${{ github.event.inputs.start }}"
          [ -z "$START" ] && START=$(date -u -d "10 days ago" +%F)
          END=$(TZ=Asia/Taipei date +%F)
          python backtest_tw.py download --start "$START" --end "$END" --data data --max-minutes 320
      - name: 解析成 CSV
        run: python backtest_tw.py build --data data
      - name: 回補夜盤／費半（只在 data/macro.csv 不存在時跑一次）
        continue-on-error: true
        run: |
          if [ ! -f data/macro.csv ]; then
            python macro_fetch.py --start 2023-01-01 --out data/macro.csv
          fi
      - name: 提交資料
        run: |
          git config user.name "tw-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.csv data/seen_dates.txt
          git diff --cached --quiet && echo "沒有新資料" && exit 0
          git commit -m "update data $(date -u +%F)"
          git pull --rebase -q
          git push
